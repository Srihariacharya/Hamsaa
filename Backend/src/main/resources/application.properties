# Hamsaa Production Build v1.2.0 (Analytics + Gender + Performance Fixes)
spring.application.name=contactpro

# Database Configuration (PostgreSQL/H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:file:./data/contactpro;DB_CLOSE_DELAY=-1}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.h2.Driver}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
google.scope=openid email profile https://www.googleapis.com/auth/contacts.readonly